services:
  turtlebot-nav:  
    image: fbe-dockerreg.rwu.de/doz-iki/staehle-vls/amr-tb3:latest
    container_name: turtlebot-nav-container
    devices:
    - /dev/dri:/dev/dri
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=$ROS_DOMAIN_ID
      - TURTLEBOT3_MODEL=burger
    volumes:
      - $IKI_WORKSPACE/26ss_ab-246955/src:/root/iki_ws/src
      - $IKI_WORKSPACE/26ss_ab-246955/maps:/root/iki_ws/maps
      - $IKI_WORKSPACE/my_bash_history:/root/.bash_history
      - $IKI_WORKSPACE/26ss_ab-246955/my_bashrc:/root/.bashrc
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
    working_dir: /root/iki_ws
    network_mode: host  
    ipc: host
    privileged: true
    stdin_open: true
    command:
      - bash
      - -c
      - |
        source /opt/ros/humble/setup.bash &&
        ros2 launch turtlebot3_gazebo turtlebot3_world.launch.py &&
        ros2 launch turtlebot3_navigation2 navigation2.launch.py use_sim_time:=True

    tty: true